[project]
name = "ai-research-paper-assistant"
version = "0.1.0"
description = "Evidence-backed research discovery and paper analysis platform"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "redis>=5.2",
  "httpx>=0.28",
  "pymupdf>=1.24",
  "python-multipart>=0.0.20",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "PyJWT>=2.10",
  "pwdlib[argon2]>=0.2.1",
  "email-validator>=2.2.0",
  "rq>=2.3.0",
  "sentence-transformers==3.0.1",
  "transformers==4.41.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.9", "mypy>=1.14"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
